<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f7f7f7; }
        .container { max-width: 350px; margin: 60px auto; background: #fff; padding: 30px 25px 20px 25px; border-radius: 8px; box-shadow: 0 2px 8px #ccc; }
        h2 { text-align: center; margin-bottom: 20px; }
        form { display: flex; flex-direction: column; gap: 15px; }
        label { font-weight: 500; margin-bottom: 5px; }
        input[type="text"], input[type="password"] { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button[type="submit"] { background: #1976d2; color: #fff; border: none; padding: 10px; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button[type="submit"]:hover { background: #1565c0; }
        .switch { text-align: center; margin-top: 10px; font-size: 15px; }
        .switch a { color: #1976d2; text-decoration: none; }
        .switch a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Login</h2>
        <form action="/login" method="post">
            <label for="uname">Username</label>
            <input type="text" name="uname" id="uname" required>
            <label for="pword">Password</label>
            <input type="password" name="pword" id="pword" required>
            <button type="submit"><a style="text-decoration: none;color: white;" href="home.html">Login</a></button>
        </form>
        <div class="switch">
            Don't have an account? <a style="text-decoration: none;color: white;" href="signup.html">Sign Up</a>
        </div>
    </div>
</body>
</html>
